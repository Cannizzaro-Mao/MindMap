name: 自动更新索引页

on:
  push:
    branches: ["main"] # 当向 main 分支推送代码时触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4 # 第一步：将你的代码签出到虚拟环境中

    - name: 设置 Python 环境 # 第二步：安装 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # 指定 Python 版本

    - name: 运行构建脚本 # 第三步：执行我们刚才编写的 Python 脚本
      run: python build_index.py # 确保脚本文件名无误

    - name: 提交并推送变更 # 第四步：将自动生成的 index.html 提交回仓库
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add index.html
        # 只有当 index.html 文件内容有变化时才提交，避免空提交
        git diff --staged --quiet || git commit -m "🤖 由 GitHub Actions 自动更新索引页"
        git push
